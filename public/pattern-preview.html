<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeeGees - Pattern Preview</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }

  .container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #38bdf8;
  }

  h2 {
    text-align: center;
    color: #38bdf8;
  }

  .layout {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  .card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
  }

  input[type="number"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 5px;
    border: none;
  }

  input[type="range"] {
    width: 100%;
  }
  input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 5px;
    border: none;
  }
  .btn {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    background: #38bdf8;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }

  .form-group {
    margin-bottom: 10px;
  }
  .hidden {
  display: none;
  }

  svg {
    width: 100%;
    height: 500px;
    background: #0f172a;
    border-radius: 10px;
  }


  /* Delete button */
  #deleteBtn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    transition: 0.2s;
  }

  #deleteBtn:hover {
    background: #c0392b;
  }

  /* Modal overlay */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  /* Modal box */
  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    width: 280px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.2s ease;
  }

  .modal-actions {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .cancel-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #bdc3c7;
    cursor: pointer;
  }

  .confirm-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #e74c3c;
    color: white;
    cursor: pointer;
  }

  .confirm-btn:hover {
    background: #c0392b;
  }

  @keyframes fadeIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  
  /* ✅ MOBILE FIX */
  @media (max-width: 768px) {
    .layout {
      grid-template-columns: 1fr;
    }

    svg {
      height: 500px;
    }
  }

  
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-buttons {
  display: flex;
  gap: 8px;
}

.header-buttons button {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: #4CAF50;
  color: white;
  cursor: pointer;
}

.header-buttons button:hover {
  background: #45a049;
}

  </style>
