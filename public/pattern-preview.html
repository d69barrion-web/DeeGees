  .modal {

    background: rgba(0,0,0,0.5);

    align-items: center;
    z-index: 999;

    padding: 8px;

  @keyframes fadeIn {

  }

<script>
  //<!-- DEBUGGER CODE -->
  window.onerror = function (message, source, lineno, colno, error) {
  debug("❌ ERROR: " + message);
  debug("📄 File: " + source);
  debug("📍 Line: " + lineno + ":" + colno);

  if (error && error.stack) {
    debug("📚 Stack: " + error.stack);
  }

  return true; // para hindi na default browser error lang
};

function debug(msg) {
  const panel = document.getElementById("debugPanel");
  if (panel) {
    panel.innerHTML += msg + "<br>";
    panel.scrollTop = panel.scrollHeight;
  }
  }
  
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdQ7By9HrCbNhy2pT9cEVVcD-YCdHEuSs",
  authDomain: "deegees-a23ec.firebaseapp.com",
  projectId: "deegees-a23ec",
  storageBucket: "deegees-a23ec.firebasestorage.app",
  messagingSenderId: "8167578850",
  appId: "1:8167578850:web:a5d3dd989aec5bd83d92bb"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let isPremium = false;

firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) return;

  const doc = await db.collection("users").doc(user.uid).get();

  if (!doc.exists) return;

  const data = doc.data();

  if (!data.isPremium) {
    isPremium = false;
    return;
  }

  if (!data.premiumUntil) {
    isPremium = true;
    console.log("Premium active (legacy user)");
    return;
  }

  const premiumUntil = data.premiumUntil.toDate();
  const now = new Date();

  if (now > premiumUntil) {
  isPremium = false;
  console.log("Premium expired");

  try {
    await db.collection("users").doc(user.uid).update({
      isPremium: false
    });
    console.log("Firestore premium downgraded");
  } catch (err) {
    console.error("Firestore downgrade failed:", err);
  }

} else {
  isPremium = true;
  console.log("Premium active until:", premiumUntil);
}
});
  
// 🔒 PROTECTION
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) {
    window.location.href = "index.html";
  }
});
  function logout() {
  firebase.auth().signOut()
    .then(() => {
      window.location.href = "index.html";
    });
  }
    
</script>
